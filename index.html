    <script>
        window.__SPLASH_START_TS__ = Date.now();
        (function() {
            var splashSrc = '/splash.jpg';
            var isNight = false;
            try {
                var cachedSafeTop = localStorage.getItem('native_safe_top_css');
                if (cachedSafeTop && /^\d+(\.\d+)?px$/.test(cachedSafeTop)) {
                    document.documentElement.style.setProperty('--native-safe-top', cachedSafeTop);
                }
                var cachedSafeBottom = localStorage.getItem('native_safe_bottom_css');
                if (cachedSafeBottom && /^\d+(\.\d+)?px$/.test(cachedSafeBottom)) {
                    document.documentElement.style.setProperty('--native-safe-bottom', cachedSafeBottom);
                }
                isNight = localStorage.getItem('night_mode_active_modern') === 'true' || localStorage.getItem('night_mode_active') === 'true';
                var themeMeta = document.getElementById('meta-theme-color');
                if (themeMeta) themeMeta.setAttribute('content', isNight ? '#000000' : '#FFFFFF');
                var appleMeta = document.getElementById('meta-apple-status-bar');
                if (appleMeta) appleMeta.setAttribute('content', isNight ? 'black-translucent' : 'default');
                document.documentElement.style.colorScheme = isNight ? 'dark' : 'light';

                var direct = localStorage.getItem('current_splash_image');
                if (direct) {
                    splashSrc = direct;
                } else {
                    var variant = localStorage.getItem('modern_home_theme_variant');
                    if (isNight) {
                        splashSrc = '/assets/splash/splash_night.jpg';
                    } else if (variant === 'sky') {
                        splashSrc = '/assets/splash/splash_sky.jpg';
                    } else if (variant === 'emerald') {
                        splashSrc = '/assets/splash/splash_emerald.jpg';
                    } else if (variant === 'burgundy') {
                        splashSrc = '/assets/splash/splash_burgundy.jpg';
                    }
                }
            } catch (e) {}
            window.__CURRENT_SPLASH_SRC__ = splashSrc;
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = splashSrc;
            link.setAttribute('fetchpriority', 'high');
            document.head.appendChild(link);
        })();
    </script>

    <script>
        if (typeof window !== 'undefined') {
            if (window.location.protocol === 'file:' || window.location.protocol === 'cdv:') {
                var s = document.createElement('script');
                s.src = 'cordova.js';
                document.head.appendChild(s);
            }
            if (!window.cordova) {
                window.cordova = { exec: function() {}, require: function() {}, platformId: 'browser' };
            }
            if (!navigator.app) {
                navigator.app = { exitApp: function() { if (window.close) window.close(); } };
            }
            // Prevent React DevTools instrumentation error in restricted environments
            window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = { isDisabled: true };
            window.addEventListener('error', function(e) {
                if (e && e.message && (
                    e.message.indexOf('ResizeObserver') !== -1 ||
                    e.message.indexOf('loop completed with undelivered notifications') !== -1 ||
                    e.message.indexOf('loop limit exceeded') !== -1
                )) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                    return true;
                }
            }, true);
            var _prevOnError = window.onerror;
            window.onerror = function(msg) {
                if (typeof msg === 'string' && (
                    msg.indexOf('ResizeObserver') !== -1 ||
                    msg.indexOf('loop completed with undelivered notifications') !== -1 ||
                    msg.indexOf('loop limit exceeded') !== -1
                )) {
                    return true;
                }
                if (_prevOnError) return _prevOnError.apply(this, arguments);
                return false;
            };
            try {
                var raw = (window.location.href + ' ' + window.location.hash + ' ' + window.location.search).toLowerCase();
                if (raw.indexOf('quran') !== -1) window.__pendingShortcut = 'quran';
                else if (raw.indexOf('prayer') !== -1 || raw.indexOf('salah') !== -1) window.__pendingShortcut = 'prayer-times';
                else if (raw.indexOf('qibla') !== -1) window.__pendingShortcut = 'qibla';
                else if (raw.indexOf('seerah') !== -1) window.__pendingShortcut = 'prophetic-seerah';
                else if (raw.indexOf('hisn') !== -1 || raw.indexOf('azkar') !== -1) window.__pendingShortcut = 'hisn-muslim';
            } catch (e) {}
        }
